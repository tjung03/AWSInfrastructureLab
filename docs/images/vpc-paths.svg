<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="530" viewBox="0 0 1180 530" role="img" aria-labelledby="title desc">
  <title id="title">AWS VPC 공개와 비공개 서브넷의 인터넷 경로</title>
  <desc id="desc">인터넷 게이트웨이가 연결된 설명용 VPC에서 공개 서브넷의 EC2는 공인 IPv4와 공개 경로를 사용한다. 비공개 서브넷의 EC2는 공인 IPv4 없이 비공개 경로에서 공개 서브넷의 NAT 게이트웨이를 통해 외부로 나간다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#93c5fd"/></marker>
    <style>
      .title{font:700 27px system-ui,sans-serif;fill:#f8fafc}.sub{font:15px system-ui,sans-serif;fill:#cbd5e1}
      .name{font:700 20px system-ui,sans-serif;fill:#f8fafc}.detail{font:15px system-ui,sans-serif;fill:#cbd5e1}
      .outside{fill:#1e293b;stroke:#94a3b8;stroke-width:2}.gateway{fill:#1e3a8a;stroke:#93c5fd;stroke-width:2}.vpc{fill:#172554;stroke:#818cf8;stroke-width:2}.public{fill:#1e293b;stroke:#60a5fa;stroke-width:2}.private{fill:#1e293b;stroke:#a5b4fc;stroke-width:2}.resource{fill:#0f172a;stroke:#64748b;stroke-width:1.5}
      .line{fill:none;stroke:#93c5fd;stroke-width:2.5;marker-end:url(#arrow)}.natline{fill:none;stroke:#a5b4fc;stroke-width:2.5;marker-end:url(#arrow)}.tag{font:14px system-ui,sans-serif;fill:#bfdbfe}
    </style>
  </defs>
  <rect width="1180" height="530" rx="22" fill="url(#bg)"/>
  <text x="42" y="51" class="title">AWS VPC · Two internet paths</text>
  <text x="42" y="78" class="sub">Illustrative private CIDRs · not evidence of deployment in an AWS account</text>
  <rect x="38" y="231" width="150" height="90" rx="16" class="outside"/>
  <text x="61" y="271" class="name">Internet</text>
  <text x="61" y="299" class="detail">External</text>
  <rect x="234" y="231" width="170" height="90" rx="16" class="gateway"/>
  <text x="253" y="271" class="name">IGW</text>
  <text x="253" y="299" class="detail">Internet gateway</text>
  <path d="M188 276 H224" class="line"/>
  <rect x="447" y="111" width="695" height="362" rx="20" class="vpc"/>
  <text x="471" y="147" class="name">VPC · 10.20.0.0/16</text>
  <rect x="472" y="168" width="643" height="126" rx="16" class="public"/>
  <text x="494" y="200" class="name">Public subnet · 10.20.0.0/24</text>
  <text x="494" y="224" class="detail">Default route 0.0.0.0/0 → IGW</text>
  <rect x="493" y="238" width="274" height="43" rx="10" class="resource"/>
  <text x="509" y="265" class="detail">EC2 · public IPv4</text>
  <rect x="790" y="238" width="299" height="43" rx="10" class="resource"/>
  <text x="806" y="265" class="detail">Public NAT gateway · EIP</text>
  <rect x="472" y="317" width="643" height="126" rx="16" class="private"/>
  <text x="494" y="349" class="name">Private subnet · 10.20.1.0/24</text>
  <text x="494" y="373" class="detail">Default route 0.0.0.0/0 → NAT gateway</text>
  <rect x="493" y="388" width="274" height="43" rx="10" class="resource"/>
  <text x="509" y="415" class="detail">EC2 · no public IPv4</text>
  <path d="M767 409 H934 V291" class="natline"/>
  <text x="785" y="395" class="tag">Outbound only</text>
  <path d="M447 261 H414" class="line"/>
  <text x="44" y="495" class="sub">Public EC2 ingress needs a public address and access rules. NAT does not provide direct inbound access to private EC2.</text>
</svg>
